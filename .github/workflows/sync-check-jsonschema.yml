name: "Sync check-jsonschema schemas"
on:
  workflow_dispatch:
  schedule:
    # Upstream refreshes its vendored schemas every Sunday at 04:00 UTC.
    - cron: "0 6 * * 1"

permissions: {}

env:
  UV_VERSION: "0.12.19"

jobs:
  sync:
    if: github.repository == 'j178/prek'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: "Sync check-jsonschema schemas"
        run: uv run scripts/sync-check-jsonschema.py

      - name: "Create Pull Request"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Sync check-jsonschema schemas"
          add-paths: |
            crates/prek/src/hooks/builtin_hooks/check_jsonschema/schemas/vendor
          branch: "sync-check-jsonschema"
          title: "Sync check-jsonschema schemas"
          body: |
            Automated update of the schemas embedded in the `check-jsonschema`
            builtin hook, downloaded from their publishers.
          base: "master"
          draft: true
